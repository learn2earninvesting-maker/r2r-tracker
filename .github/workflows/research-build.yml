# R2R Stocks X-ray — builds a results season from the files you sent the tracker bot.
# Started by the bot (Research.gs). The files are fetched straight from Telegram, so the PDFs
# and the CSV are never saved in this repository; only the JSON built from them is.
# Needs one repository secret: TELEGRAM_TOKEN (the tracker bot's token).
name: Build research season
on:
  workflow_dispatch:
    inputs:
      build:     { description: 'Build id (from the bot)', required: true }
      csv:       { description: 'Telegram file_id of the Tickertape CSV', required: false, default: '' }
      concall:   { description: 'Telegram file_id of the Transcript Summary PDF', required: false, default: '' }
      catalysts: { description: 'Telegram file_id of the Growth Catalysts PDF', required: false, default: '' }
      season:    { description: 'Season, e.g. Q3FY27 (blank = read it from the concall PDF)', required: false, default: '' }
permissions:
  contents: write
concurrency:
  group: research-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pdfplumber==0.11.4
      - name: Fetch the files from Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CSV: ${{ inputs.csv }}
          CONCALL: ${{ inputs.concall }}
          CATALYSTS: ${{ inputs.catalysts }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/in"
          get() {
            [ -z "$1" ] && return 0
            path=$(curl -sf "https://api.telegram.org/bot${TOKEN}/getFile?file_id=$1" | python3 -c 'import sys,json; print(json.load(sys.stdin)["result"]["file_path"])')
            curl -sf -o "$RUNNER_TEMP/in/$2" "https://api.telegram.org/file/bot${TOKEN}/${path}"
            echo "got $2 ($(stat -c %s "$RUNNER_TEMP/in/$2") bytes)"
          }
          get "$CSV" coverage.csv
          get "$CONCALL" concall.pdf
          get "$CATALYSTS" catalysts.pdf
      - name: Build
        env:
          BUILD: ${{ inputs.build }}
          SEASON: ${{ inputs.season }}
        run: |
          set -euo pipefail
          IN="$RUNNER_TEMP/in"
          args=()
          [ -f "$IN/coverage.csv" ] && args+=(--csv "$IN/coverage.csv")
          [ -f "$IN/concall.pdf" ] && args+=(--concall "$IN/concall.pdf")
          [ -f "$IN/catalysts.pdf" ] && args+=(--catalysts "$IN/catalysts.pdf")
          # no CSV this time → reuse the live season's numbers
          if [ ! -f "$IN/coverage.csv" ] && [ -f research/live.json ]; then args+=(--reuse research/seasons/$(python3 -c 'import json;print(json.load(open("research/live.json"))["folder"])')/index.json); fi
          [ -n "$SEASON" ] && args+=(--season "$SEASON")
          python3 research/tools/build_season.py "${args[@]}" --out research/seasons --folder "tmp-$BUILD" > "$RUNNER_TEMP/report.json"
          S=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["season"])' "$RUNNER_TEMP/report.json")
          F="$S-$BUILD"
          rm -rf "research/seasons/$F"; mv "research/seasons/tmp-$BUILD" "research/seasons/$F"
          python3 - "$F" "$BUILD" <<'PY'
          import json, sys, os
          f, b = sys.argv[1], sys.argv[2]
          for name in ('index.json', 'report.json'):
              p = f'research/seasons/{f}/{name}'; d = json.load(open(p)); d['folder'] = f
              json.dump(d, open(p, 'w'), ensure_ascii=False, separators=(',', ':') if name == 'index.json' else None, indent=None if name == 'index.json' else 1)
          rep = json.load(open(f'research/seasons/{f}/report.json'))
          json.dump({'build': b, 'folder': f, 'season': rep['season'], 'label': rep['label'], 'built': rep['built'], 'report': rep}, open('research/staging.json', 'w'), ensure_ascii=False, indent=1)
          PY
          python3 research/tools/prune.py research
      - name: Save
        run: |
          git config user.name "R2R research bot"
          git config user.email "r2r-bot@users.noreply.github.com"
          git add -A research
          git commit -m "Research season built (${{ inputs.build }})" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }} && git push
