<style>
/* R2R Expenses — same navy/amber identity as the R2R tracker. Dark-first; follows the phone's light mode. */
:root{
  --bg:#0b1120; --surface:#121a2e; --surface-2:#1a2440; --line:#24304f; --fg:#eef1f8; --muted:#a3adc8; --faint:#76809c;
  --accent:#f0a500; --accent-ink:#1a1200; --accent-soft:rgba(240,165,0,.14);
  --good:#3fc387; --good-soft:rgba(63,195,135,.14); --warn:#f39a4b; --warn-soft:rgba(243,154,75,.14); --bad:#f07070; --bad-soft:rgba(240,112,112,.14); --info:#6fa3f5;
  --c1:#f0a500; --c2:#6fa3f5; --c3:#3fc387; --c4:#e478a8; --c5:#a58cf0; --c6:#f39a4b; --c7:#5fd0d6; --c8:#93a3b8;
  --f-display:"Sora",ui-sans-serif,system-ui,sans-serif; --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:16px; color-scheme:dark;
}
@media (prefers-color-scheme:light){:root{
  --bg:#f3f4f8; --surface:#ffffff; --surface-2:#f1f2f7; --line:#e1e4ee; --fg:#0f1629; --muted:#556079; --faint:#7d869c;
  --accent:#c98700; --accent-ink:#ffffff; --accent-soft:rgba(201,135,0,.12);
  --good:#178a57; --good-soft:#e2f4ea; --warn:#c2620f; --warn-soft:#fbeedf; --bad:#c23b3b; --bad-soft:#fbe6e6; --info:#2f6fcf;
  --c1:#c98700; --c2:#2f6fcf; --c3:#178a57; --c4:#c24b7a; --c5:#6b52d1; --c6:#c2620f; --c7:#1f8f96; --c8:#5a6b80; color-scheme:light}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:20px} h2{font-size:17px} h3{font-size:15px}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;gap:12px;padding-block:12px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;flex:none}
.who{flex:1;min-width:0}
.who p{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 16px;min-height:40px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
main{padding-block:18px 48px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h2{flex:1;min-width:0}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:16px;gap:4px}
.kpi .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-size:22px}
.kpi .ft{font-size:12px;color:var(--faint)}
.kpi.hero{background:linear-gradient(160deg,var(--surface-2),var(--surface));border-color:var(--accent)}
.kpi.hero .val{color:var(--accent)}
select,input[type=search],input[type=month]{min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 12px;width:100%}
.filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:10px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .m{flex:1;min-width:0}
.li .m b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .m span{font-size:12px;color:var(--muted)}
.amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.in{color:var(--good)} .amt.xfer{color:var(--faint)}
.day{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding-top:14px}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.good{background:var(--good-soft);color:var(--good)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.progress{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;border-radius:999px;background:var(--good)}
.progress.warn i{background:var(--warn)} .progress.over i{background:var(--bad)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:24px 14px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:12px}
.legend{display:flex;flex-direction:column;gap:7px;font-size:13px;flex:1;min-width:180px}
.legend div{display:flex;align-items:center;gap:8px}
.legend .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.hint{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.hint b{color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;cursor:pointer;text-decoration:none;color:var(--fg)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.skel{background:linear-gradient(90deg,var(--surface),var(--surface-2),var(--surface));background-size:200% 100%;animation:sh 1.3s infinite;border-radius:12px;min-height:18px}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.err{background:var(--bad-soft);color:var(--fg);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:8px}
footer{color:var(--faint);font-size:12px;padding-block:6px 30px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.filters .fs{grid-column:1/-1}}
@media (max-width:420px){.kpi .val{font-size:19px}}
</style>
</head>

<script>

    h("div",{class:"card kpi hero"},h("div",{class:"lbl"},"Spending"),h("div",{class:"val num"},inr(T.exp)),h("div",{class:"ft"},periodLabel()+" · "+list.filter(t=>t.type==="Expense").length+" entries")),

  out.push(h("div",{class:"grid2"},h("div",{class:"card"},h("div",{class:"card-h"},h("h2",null,"Money in vs out"),h("span",{class:"sub"},"Last 6 months")),cashChart()),
    h("div",{class:"card"},h("div",{class:"card-h"},h("h2",null,"Where it went"),h("span",{class:"sub"},periodLabel())),donut(T))));
  out.push(h("div",{class:"grid2"},budgetsMini(),upcomingCard()));

  const top=Object.entries(tm).sort((a,b)=>b[1]-a[1]).slice(0,6);

function cashChart(){
